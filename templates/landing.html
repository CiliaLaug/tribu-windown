<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tribu Box – Deine letzte Entscheidung</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fdf8f4;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .logo { margin-bottom: 32px; }
    .logo img { height: 48px; }
    .card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      text-align: center;
    }
    .headline {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: #222;
    }
    .subtext {
      font-size: 1rem;
      color: #666;
      margin-bottom: 36px;
      line-height: 1.6;
    }
    .keep-btn {
      display: block;
      width: 100%;
      padding: 18px;
      background: #f4a261;
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 20px;
      transition: background 0.2s;
    }
    .keep-btn:hover { background: #e07b3a; }
    .return-link {
      display: block;
      color: #999;
      font-size: 0.9rem;
      text-decoration: underline;
      cursor: pointer;
      background: none;
      border: none;
      width: 100%;
    }
    .return-link:hover { color: #666; }
    .confirmation {
      font-size: 1.1rem;
      color: #2a9d5c;
      font-weight: 500;
      line-height: 1.6;
    }
    .loading .keep-btn, .loading .return-link { pointer-events: none; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="logo">
    <img src="https://cdn.shopify.com/s/files/1/0449/5989/1607/files/tribu-logo.png" alt="Tribu Box" onerror="this.style.display='none'">
  </div>

  <div class="card" id="main-card">
    <div id="choice-view">
      <p class="headline">Ein letztes Angebot von uns 🧡</p>
      <p class="subtext">
        Tribu Box verabschiedet sich — und möchte dir noch ein letztes Angebot machen.<br><br>
        Du kannst deine aktuelle Box für einmalig <strong>€49,99</strong> behalten,
        oder du sendest sie zurück.
      </p>
      <button class="keep-btn" onclick="submitChoice('keep')">
        ✨ Deine Box für einmalig €49,99 behalten
      </button>
      <button class="return-link" onclick="submitChoice('end')">
        Meine Box zurücksenden
      </button>
    </div>

    <div id="confirm-view" style="display:none">
      <p class="confirmation" id="confirm-text"></p>
    </div>

    <div id="error-view" style="display:none">
      <p style="color:#c0392b;">
        Etwas ist schiefgelaufen. Bitte versuche es später erneut oder schreib uns an hello@tribu-box.com.
      </p>
    </div>
  </div>

  <script>
    const TOKEN = {{ token | tojson }};
    const MESSAGES = {
      keep: "Wunderbar! Wir berechnen €49,99 und deine Box bleibt bei dir. Du bekommst eine Bestätigung per E-Mail. 🧡",
      end:  "Alles klar. Wir organisieren die Rücksendung — du bekommst alle Details per E-Mail. 🧡"
    };

    function submitChoice(choice) {
      const card = document.getElementById('main-card');
      card.classList.add('loading');

      fetch('/submit', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({token: TOKEN, choice: choice})
      })
      .then(r => r.json())
      .then(data => {
        card.classList.remove('loading');
        if (data.ok) {
          document.getElementById('choice-view').style.display = 'none';
          document.getElementById('confirm-text').textContent = MESSAGES[choice];
          document.getElementById('confirm-view').style.display = 'block';
        } else {
          document.getElementById('choice-view').style.display = 'none';
          document.getElementById('error-view').style.display = 'block';
        }
      })
      .catch(() => {
        card.classList.remove('loading');
        document.getElementById('choice-view').style.display = 'none';
        document.getElementById('error-view').style.display = 'block';
      });
    }
  </script>
</body>
</html>
