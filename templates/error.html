<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tribu Box</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --text: #223037;
      --text-muted: #4f595f;
      --bg: #f0faf5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .logo-wrap { margin-bottom: 32px; }
    .logo-wrap img { height: 40px; display: block; }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(34, 48, 55, 0.08);
    }
    p {
      color: var(--text-muted);
      line-height: 1.7;
      font-size: 0.975rem;
    }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <img src="https://tribu-cms.s3.eu-central-1.amazonaws.com/large_3_9c19d51029.png"
         alt="Tribu Box"
         onerror="this.src='https://cdn.shopify.com/s/files/1/0449/5989/1607/files/tribu-logo.png'">
  </div>
  <div class="card">
    <p>{{ message }}</p>
  </div>
</body>
</html>
